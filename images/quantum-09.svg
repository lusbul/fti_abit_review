<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460"><rect width="850" height="460" rx="24" fill="#edf5fc"/><g font-family="Arial,sans-serif" fill="#143b69"><text x="35" y="48" font-size="25" font-weight="bold">Квантова інтерференція</text><text x="35" y="82" font-size="17">Один кубіт · H → Z → H</text><path d="M60 165H790" stroke="#2463a2" stroke-width="4"/><g fill="#fff" stroke="#2463a2" stroke-width="3"><rect x="170" y="125" width="76" height="76" rx="8"/><rect x="365" y="125" width="76" height="76" rx="8"/><rect x="560" y="125" width="76" height="76" rx="8"/></g><g font-size="28" text-anchor="middle"><text x="208" y="172">H</text><text x="403" y="172">Z</text><text x="598" y="172">H</text></g><g font-size="21" text-anchor="middle"><text x="75" y="147">|0⟩</text><text x="770" y="147">|1⟩</text><text x="300" y="244">(|0⟩ + |1⟩)/√2</text><text x="500" y="280">(|0⟩ − |1⟩)/√2</text></g><path d="M300 252V310H500V288" fill="none" stroke="#7ca7d2" stroke-width="2"/><rect x="35" y="335" width="780" height="91" rx="12" fill="white"/><text x="55" y="373" font-size="20">Зміна фази змінює результат вимірювання.</text><text x="55" y="402" font-size="17">H — перетворення Адамара; Z — зміна знака амплітуди |1⟩.</text></g></svg>
